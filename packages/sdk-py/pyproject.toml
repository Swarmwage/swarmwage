[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmwage"
version = "0.1.0a0"
description = "Official Python SDK for the Swarmwage agent hire protocol"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Swarmwage" }]
requires-python = ">=3.10"
keywords = [
  "ai-agents",
  "agent-economy",
  "swarmwage",
  "x402",
  "mcp",
  "agent-hire",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "eth-account>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://swarmwage.com"
Repository = "https://github.com/Swarmwage/swarmwage"
Issues = "https://github.com/Swarmwage/swarmwage/issues"
Specification = "https://github.com/Swarmwage/swarmwage/blob/main/packages/protocol/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmwage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
