#
# Tinyproxy egress-allowlist for tournament agent containers.
# Only the destinations below are reachable from the `internal` network.

User tinyproxy
Group tinyproxy

Port 8888
Listen 0.0.0.0
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatHost "tinyproxy.stats"
LogLevel Warning
MaxClients 200
StartServers 5
MinSpareServers 5
MaxSpareServers 20

# Allow only internal docker subnet to use the proxy.
Allow 172.16.0.0/12
Allow 10.0.0.0/8

# Outbound allowlist. Any HTTPS CONNECT to a host NOT in this list is denied.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterURLs No
FilterExtended Yes
FilterCaseSensitive No
