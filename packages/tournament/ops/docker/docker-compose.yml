  # ----- External buyer-agents -----
  # Two Claude Haiku 4.5 buyers, $10 USDC each, generate compound-order
  # demand against the 10 internal agents. The buyer container has no
  # seller HTTP surface — it only initiates hires.
  buyer_01:
    build:
      context: ../..
      dockerfile: buyer-agent/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:size=50m
      - /agent/memory:size=20m,uid=1001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      - wallet-svc
      - egress-proxy
    networks:
      - internal
    environment:
      BUYER_ID: buyer_01
      REGISTRY_URL: https://api.swarmwage.com
      WALLET_SVC_URL: http://wallet-svc:7000
      TICK_INTERVAL_MS: 300000
      MAX_API_USD: 1
      STOP_BALANCE_USDC: "0.2"
      TOURNAMENT_START_ISO: "${TOURNAMENT_START_ISO}"
      TOURNAMENT_END_ISO: "${TOURNAMENT_END_ISO}"
      HTTP_PROXY: http://egress-proxy:8888
      HTTPS_PROXY: http://egress-proxy:8888
      NO_PROXY: "wallet-svc,leaderboard,orchestrator,localhost,127.0.0.1"
